<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f3f6f0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f1511" media="(prefers-color-scheme: dark)" />
  <title>You are offline · Funkyfarm</title>
  <style>
    :root { color-scheme: light; --bg: #f3f6f0; --surface: #ffffff; --ink: #14201a; --muted: #55635a; --line: #d3dcd0; --farm: #2c7a43; --eu: #2347a6; }
    @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg: #0f1511; --surface: #18201a; --ink: #e5ece3; --muted: #9ca99f; --line: #2b362d; --farm: #6cc487; --eu: #86a6f0; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; background: var(--bg); color: var(--ink); font: 17px/1.6 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    main { max-width: 460px; border: 1px solid var(--line); background: var(--surface); padding: clamp(22px, 6vw, 36px); border-radius: 22px; }
    img { display: block; width: 180px; max-width: 100%; height: auto; object-fit: contain; padding: 8px; border-radius: 16px; background: #f3f6f0; }
    h1 { font: 800 clamp(30px, 8vw, 40px)/1.1 'Bricolage Grotesque', ui-rounded, system-ui, sans-serif; letter-spacing: -.02em; margin: 20px 0 12px; }
    p { color: var(--muted); }
    a { display: inline-block; background: var(--farm); color: var(--surface); padding: 12px 20px; border-radius: 12px; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid var(--eu); outline-offset: 4px; }
  </style>
</head>
<body><main><img src="/assets/funkyfarm-logo.png" width="640" height="571" alt="Funkyfarm" /><h1>You are offline.</h1><p>Reconnect to open your farm records. Private form drafts that finished saving stay encrypted on this device.</p><p>If a farm form is still open in another tab, keep it open until you have checked its draft save message.</p><a href="/app/home">Try again</a></main></body>
</html>
