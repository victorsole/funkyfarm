[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "funkyfarmers"
version = "0.1.0"
description = "Private farm records and guided paperwork for farmers and advisers"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23.1,<26",
  "python-multipart>=0.0.18,<1",
  "pydantic>=2.9,<3",
  "reportlab>=4.2,<5",
  "openpyxl>=3.1,<4",
  "pypdf>=5,<7",
  "Pillow>=11,<13",
  "httpx>=0.27,<1",
  "cryptography>=43,<47",
  "rasterio>=1.4,<2",
  "shapely==2.1.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-timeout>=2.3,<3"]

[project.scripts]
funkyfarmers-migrate = "funkyfarmers.migrate:main"

[tool.setuptools.packages.find]
where = ["services/api"]

[tool.setuptools.package-data]
funkyfarmers = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
