name: funkyfarm-local
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: funkyfarm_admin
      POSTGRES_PASSWORD: ${FUNKYFARM_ADMIN_PASSWORD:?Run scripts/Local.ps1 setup}
      POSTGRES_DB: funkyfarm
    ports: ["127.0.0.1:55440:5432"]
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funkyfarm_admin -d funkyfarm"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  database:
