worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_max_body_size 21m;
    client_body_timeout 35s;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $uri $cache_control {
        default "no-store";
        ~^/assets/ "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        root /srv/public;
        index index.html;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Cache-Control $cache_control always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://service.pdok.nl https://www.wms.nrw.de; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

        location ^~ /.well-known/oauth- {
            proxy_pass http://funkyfarm-api:8139;
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_read_timeout 10s;
        }
        location /api/ {
            proxy_pass http://funkyfarm-api:8139;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_http_version 1.1;
            proxy_read_timeout 100s;
            proxy_buffering off;
            proxy_request_buffering off;
        }
        location = /health {
            proxy_pass http://funkyfarm-api:8139/health;
            proxy_set_header Host $http_host;
            access_log off;
        }
        location ^~ /runtime/ { return 404; }
        location ^~ /private-documents/ { return 404; }
        location ~ /\. { return 404; }
        location /assets/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
